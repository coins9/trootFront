# =============================================================================
# T:ROOT (trootfront) - Codemagic CI/CD
# =============================================================================
# React Native 0.86.2 · Node 22 · Xcode 26 · Ruby 3.2
#
# App Store Connect 등록 정보:
#   ▶ 앱 이름         : TROOT-타투루트
#   ▶ Apple ID       : 6796560858
#   ▶ Bundle ID      : com.troot.app
#
# App Store Connect API Key:
#   ▶ Key ID          : S3J35WH3LL
#   ▶ Issuer ID       : 472b6530-725e-4611-8d26-f92d5520d536
#
# Codemagic 웹 UI → Teams → Environment variables > Group "troot_secrets":
#   ▶ APP_STORE_CONNECT_PRIVATE_KEY  ← .p8 파일 내용 그대로
#   ▶ DIST_CERT_P12                  ← 배포 인증서 .p12 base64
#   ▶ DIST_CERT_P12_PASSWORD         ← p12 비밀번호
#   ▶ PROVISIONING_PROFILE           ← .mobileprovision base64
# =============================================================================

definitions:
  cache_paths: &cache_paths
    - ~/.npm
    - $HOME/.gradle/caches
    - $CM_BUILD_DIR/node_modules
    - $CM_BUILD_DIR/ios/Pods

workflows:

  # ---------------------------------------------------------------------------
  # 1) Android — Debug APK
  # ---------------------------------------------------------------------------
  android-debug:
    name: Android · Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps
      - name: Build debug APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) Android — Release AAB
  # ---------------------------------------------------------------------------
  android-release:
    name: Android · Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
      android_signing:
        - trootapp_keystore
      node: 22
      java: 17
      vars:
        PACKAGE_NAME: "com.troot.app"
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Bump build number
        script: |
          cd android
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal 2>/dev/null || echo 0) + 1))
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # ---------------------------------------------------------------------------
  # 3) iOS — Unsigned IPA (Sideloadly 배포용, 무서명)
  # ---------------------------------------------------------------------------
  ios-unsigned-build:
    name: iOS · Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: 26
      cocoapods: default
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps

      - name: CocoaPods 설치
        script: |
          cd ios
          pod install --repo-update

      - name: JS 번들 사전 생성
        script: |
          node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/TRootApp/main.jsbundle \
            --assets-dest ios/TRootApp

          if [ ! -f "ios/TRootApp/main.jsbundle" ]; then
            echo "main.jsbundle 생성 실패"
            exit 1
          fi
          echo "main.jsbundle 생성 완료 · $(du -h ios/TRootApp/main.jsbundle | cut -f1)"

      - name: Xcode Archive (완전 무서명)
        script: |
          cd ios
          export NODE_BINARY=$(command -v node)

          set -o pipefail
          xcodebuild archive \
            -workspace TRootApp.xcworkspace \
            -scheme TRootApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/TRootApp.xcarchive \
            -destination "generic/platform=iOS" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee ../build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "====== 빌드 실패 로그 ======"
            grep -E "error:" ../build.log | grep -v "^2" | head -60
            exit $BUILD_EXIT
          fi
          echo "Archive 성공"

      - name: 서명 흔적 완전 제거 + IPA 패키징
        script: |
          APP_PATH=$(find ./build/TRootApp.xcarchive -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo ".app 없음"
            exit 1
          fi

          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name "embedded.mobileprovision" -delete 2>/dev/null || true

          find "$APP_PATH" \( -name "*.dylib" -o -name "*.framework" \) | while read -r f; do
            codesign --remove-signature "$f" 2>/dev/null || true
          done
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr TRootApp-unsigned.ipa Payload/
          rm -rf Payload

          echo "IPA 패키징 완료"

    artifacts:
      - TRootApp-unsigned.ipa
      - build.log
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 4) iOS — TestFlight (수동 서명 파일 관리)
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      xcode: 26
      cocoapods: default
      # groups:
      #   - troot_secrets         # Codemagic 웹에서 그룹 생성 후 아래 주석 해제
      #     APP_STORE_CONNECT_PRIVATE_KEY, DIST_CERT_P12, DIST_CERT_P12_PASSWORD, PROVISIONING_PROFILE
      vars:
        APP_STORE_CONNECT_KEY_IDENTIFIER: S3J35WH3LL
        APP_STORE_CONNECT_ISSUER_ID: 472b6530-725e-4611-8d26-f92d5520d536
        BUNDLE_IDENTIFIER: com.troot.app
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps

      - name: CocoaPods 설치
        script: |
          cd ios
          pod install --repo-update

      - name: JS 번들 사전 생성
        script: |
          node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/TRootApp/main.jsbundle \
            --assets-dest ios/TRootApp

          if [ ! -f "ios/TRootApp/main.jsbundle" ]; then
            echo "main.jsbundle 생성 실패"
            exit 1
          fi

      - name: 빌드 번호 자동 증가
        script: |
          cd ios
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version 1.0.0

      - name: 인증서 및 프로파일 복원 (수동 서명)
        script: |
          echo "=== 1. 환경변수 확인 ==="
          echo "DIST_CERT_P12 길이: ${#DIST_CERT_P12}"
          echo "DIST_CERT_P12_PASSWORD 길이: ${#DIST_CERT_P12_PASSWORD}"
          echo "PROVISIONING_PROFILE 길이: ${#PROVISIONING_PROFILE}"

          echo "=== 2. keychain initialize ==="
          keychain initialize || { echo "keychain initialize 실패"; exit 1; }

          echo "=== 3. p12 디코딩 ==="
          echo "$DIST_CERT_P12" | base64 --decode > /tmp/distribution.p12 || { echo "p12 디코딩 실패"; exit 1; }
          echo "p12 파일 크기: $(wc -c < /tmp/distribution.p12) bytes"

          echo "=== 4. 인증서 추가 ==="
          keychain add-certificates \
            --certificate /tmp/distribution.p12 \
            --certificate-password "$DIST_CERT_P12_PASSWORD" || { echo "인증서 추가 실패"; exit 1; }

          echo "=== 5. 프로비저닝 프로파일 설치 ==="
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || { echo "프로파일 디코딩 실패"; exit 1; }

          echo "=== 6. use-profiles ==="
          cd ios && xcode-project use-profiles || { echo "use-profiles 실패"; exit 1; }
          cd ..

          echo "=== 완료 ==="

      - name: IPA 빌드
        script: |
          set -o pipefail
          mkdir -p build/ios/ipa
          xcode-project build-ipa \
            --workspace ios/TRootApp.xcworkspace \
            --scheme TRootApp \
            --config Release \
            2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "====== 빌드 실패 ======"
            grep -E "error:" build.log | grep -v "^2" | head -40
            exit 1
          fi
          rm -f /tmp/distribution.p12
          echo "IPA 빌드 완료"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

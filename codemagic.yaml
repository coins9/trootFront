# T:ROOT (trootfront) - Codemagic CI/CD
# =============================================================================
# React Native 0.86.2 · Node 22 · Xcode 26 · Ruby 3.2
#
# App Store Connect API Key:
#   ▶ Key ID          : S3J35WH3LL
#   ▶ Issuer ID       : 472b6530-725e-4611-8d26-f92d5520d536
#   ▶ Apple ID        : 6796560858
#   ▶ Bundle ID       : com.troot.app
#
# ===== 사전 준비 (Codemagic 웹 UI, 한 번만) =====
#
# 1) Teams > Integrations > "App Store Connect API keys" > Add new key
#      - Name    : "TROOT API Key"
#      - Issuer  : 472b6530-725e-4611-8d26-f92d5520d536
#      - Key ID  : S3J35WH3LL
#      - API Key : AuthKey_S3J35WH3LL.p8 파일 업로드
#
# 2) Apple Developer > Certificates, Identifiers & Profiles > Identifiers >
#    Bundle ID "com.troot.app" 등록되어 있는지 확인 (없으면 등록)
#
# .p12 인증서/mobileprovision 파일은 필요 없음 — API Key 로 Codemagic 이 자동 생성.
# =============================================================================

definitions:
  cache_paths: &cache_paths
    - ~/.npm
    - $HOME/.gradle/caches
    - $CM_BUILD_DIR/node_modules
    - $CM_BUILD_DIR/ios/Pods

workflows:

  # ---------------------------------------------------------------------------
  # 1) Android — Debug APK
  # ---------------------------------------------------------------------------
  android-debug:
    name: Android · Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps
      - name: Build debug APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) Android — Release AAB
  # ---------------------------------------------------------------------------
  android-release:
    name: Android · Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials
      android_signing:
        - trootapp_keystore
      node: 22
      java: 17
      vars:
        PACKAGE_NAME: "com.troot.app"
    cache:
      cache_paths: *cache_paths
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Bump build number
        script: |
          cd android
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal 2>/dev/null || echo 0) + 1))
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # ---------------------------------------------------------------------------
  # 3) iOS — Unsigned IPA (Sideloadly 무서명, 시크릿 불필요)
  # ---------------------------------------------------------------------------
  ios-unsigned-build:
    name: iOS · Unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_credentials
      node: 22
      xcode: 26
      cocoapods: default
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps

      - name: Firebase 설정 파일 복사
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/TRootApp/GoogleService-Info.plist

      - name: CocoaPods 설치
        script: |
          cd ios
          pod install --repo-update

      - name: JS 번들 사전 생성
        script: |
          node_modules/.bin/react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/TRootApp/main.jsbundle \
            --assets-dest ios/TRootApp
          test -f "ios/TRootApp/main.jsbundle" && echo "main.jsbundle 생성 완료"

      - name: Xcode Archive (완전 무서명)
        script: |
          cd ios
          export NODE_BINARY=$(command -v node)
          set -o pipefail
          xcodebuild archive \
            -workspace TRootApp.xcworkspace \
            -scheme TRootApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/TRootApp.xcarchive \
            -destination "generic/platform=iOS" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee ../build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "====== 빌드 실패 ======"
            grep -E "error:" ../build.log | grep -v "^2" | head -60
            exit $BUILD_EXIT
          fi

      - name: 서명 흔적 제거 + IPA 패키징
        script: |
          APP_PATH=$(find ./build/TRootApp.xcarchive -name "*.app" -type d | head -n 1)
          [ -z "$APP_PATH" ] && { echo ".app 없음"; exit 1; }

          find "$APP_PATH" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name "embedded.mobileprovision" -delete 2>/dev/null || true
          find "$APP_PATH" \( -name "*.dylib" -o -name "*.framework" \) | while read -r f; do
            codesign --remove-signature "$f" 2>/dev/null || true
          done
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr TRootApp-unsigned.ipa Payload/
          rm -rf Payload
          echo "IPA 패키징 완료"

    artifacts:
      - TRootApp-unsigned.ipa
      - build.log
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 4) iOS — TestFlight
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: TROOT API Key
    environment:
      groups:
        - app_credentials
        - app_credentials
      node: 22
      xcode: 26
      cocoapods: default
      vars:
        BUNDLE_ID: "com.troot.app"
        TEAM_ID: "H2YL36R6Y7"
    scripts:
      - name: 패키지 설치
        script: npm install --legacy-peer-deps

      - name: Firebase 설정 파일 복사
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/TRootApp/GoogleService-Info.plist

      - name: CocoaPods 설치
        script: |
          cd ios
          pod install --repo-update

      - name: 인증서·프로파일 설치
        script: |
          set -e
          keychain initialize
          # create-certificate 대신 fetch-signing-files --certificate-key 사용:
          # 기존 인증서를 재사용하고, 해당 인증서가 포함된 프로파일도 함께 가져옴
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose

      - name: 빌드 번호 자동 증가
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEW=$(($LATEST + 1))
          agvtool new-version -all $NEW
          agvtool new-marketing-version 1.0.0
          echo "새 빌드 번호: $NEW"

      - name: IPA 빌드
        script: |
          set -e
          PROFILE_PATH=$(find / -name "*.mobileprovision" -maxdepth 12 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: 프로파일 없음"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            awk '/<key>UUID<\/key>/{found=1;next} found{gsub(/.*<string>|<\/string>.*/,""); print; exit}')
          echo "Profile UUID: $PROFILE_UUID"

          mkdir -p "$CM_BUILD_DIR/build/ios"
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/TRootApp.xcarchive"
          EXPORT_PATH="$CM_BUILD_DIR/build/ios/ipa"
          cp ios/ExportOptions.plist /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.troot.app $PROFILE_UUID" /tmp/ExportOptions.plist

          set -o pipefail
          xcodebuild archive \
            -workspace ios/TRootApp.xcworkspace \
            -scheme TRootApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            2>&1 | tee build.log

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1 | tee -a build.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build.log

    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

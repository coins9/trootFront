# =============================================================================
# T:ROOT (trootfront) - Codemagic CI/CD
# =============================================================================
# React Native 0.86.2 · Node 20 · Xcode 16 · Ruby 3.2
#
# 워크플로우:
#   1) android-debug      → 개발용 debug APK (Sideload/직접 설치)
#   2) android-release    → Play Store internal 트랙 자동 배포 (AAB)
#   3) ios-unsigned       → Sideloadly용 unsigned IPA
#   4) ios-testflight     → App Store Connect (TestFlight) 자동 업로드
#
# App Store Connect 등록 정보:
#   ▶ 앱 이름         : TROOT-타투루트
#   ▶ Apple ID       : 6796560858
#   ▶ SKU            : TROOT_001
#   ▶ Bundle ID      : com.troot.app
#
# App Store Connect API Key (Team 발급):
#   ▶ Integration 이름 : "TROOT API Key"   (Codemagic > Teams > Integrations)
#   ▶ Key ID          : S3J35WH3LL
#   ▶ Issuer ID       : 472b6530-725e-4611-8d26-f92d5520d536
#
# Codemagic 웹 UI → Teams → Environment variables (Groups):
#   ▶ app_credentials
#       - APP_STORE_APP_ID = 6796560858
#       - BUNDLE_ID        = com.troot.app
#   ▶ keystore_credentials
#       - CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
#   ▶ google_play (Android AAB 배포 시)
#       - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
# =============================================================================

definitions:
  cache_paths: &cache_paths
    - ~/.npm
    - $HOME/.gradle/caches
    - $CM_BUILD_DIR/node_modules
    - $CM_BUILD_DIR/ios/Pods

  scripts:
    - &install_node_deps
      name: Install Node dependencies
      script: |
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps

# =============================================================================
workflows:

  # ---------------------------------------------------------------------------
  # 1) Android — Debug APK (Sideload 배포용)
  # ---------------------------------------------------------------------------
  android-debug:
    name: Android · Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.11.1
      java: 17
    cache:
      cache_paths: *cache_paths
    scripts:
      - *install_node_deps
      - name: Build debug APK
        script: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) Android — Release AAB (Google Play internal 배포)
  # ---------------------------------------------------------------------------
  android-release:
    name: Android · Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials       # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      android_signing:
        - trootapp_keystore
      node: 20.11.1
      java: 17
      vars:
        PACKAGE_NAME: "com.troot.app"
    cache:
      cache_paths: *cache_paths
    scripts:
      - *install_node_deps
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Bump build number
        script: |
          cd android
          BUILD_NUMBER=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal 2>/dev/null || echo 0) + 1))
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
          echo "New versionCode: $BUILD_NUMBER"
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # ---------------------------------------------------------------------------
  # 3) iOS — Unsigned IPA (Sideloadly 설치용, 무료 계정 폴백)
  # ---------------------------------------------------------------------------
  ios-unsigned:
    name: iOS · Unsigned IPA (Sideloadly)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 20.11.1
      xcode: 16.1
      cocoapods: default
    cache:
      cache_paths: *cache_paths
    scripts:
      - *install_node_deps
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Build unsigned archive
        script: |
          cd ios
          xcodebuild -workspace TRootApp.xcworkspace \
            -scheme TRootApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/TRootApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        script: |
          cd $CM_BUILD_DIR/build/TRootApp.xcarchive/Products/Applications
          mkdir -p Payload
          mv TRootApp.app Payload/
          zip -qr $CM_BUILD_DIR/build/TRootApp-unsigned.ipa Payload
          echo "IPA ready: build/TRootApp-unsigned.ipa"
    artifacts:
      - build/*.ipa
      - build/*.xcarchive
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 4) iOS — Signed IPA → TestFlight 자동 업로드
  # ---------------------------------------------------------------------------
  #
  # 사전 조건 (Codemagic 웹):
  #   Teams > Integrations > "App Store Connect API keys"
  #     - Name    : TROOT API Key
  #     - Issuer  : 472b6530-725e-4611-8d26-f92d5520d536
  #     - Key ID  : S3J35WH3LL
  #     - API Key : (.p8 파일 업로드)
  #   Teams > Environment variables > Group "app_credentials"
  #     - APP_STORE_APP_ID = 6796560858
  #     - BUNDLE_ID        = com.troot.app
  # ---------------------------------------------------------------------------
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TROOT API Key         # Codemagic에 등록한 정확한 Integration 이름
    environment:
      groups:
        - app_credentials                       # APP_STORE_APP_ID, BUNDLE_ID
      node: 20.11.1
      xcode: 16.1
      cocoapods: default
    cache:
      cache_paths: *cache_paths
    scripts:
      - *install_node_deps
      - name: Pin NODE_BINARY for Xcode script phase
        # Xcode "Bundle React Native code and images" build phase 는 /bin/sh 로 실행되어
        # 기본 PATH 에 node 가 없어 실패함. 절대경로로 .xcode.env.local 을 만들어 고정.
        script: |
          set -e
          NODE_PATH_ABS="$(command -v node)"
          echo "Using node: $NODE_PATH_ABS"
          echo "export NODE_BINARY=$NODE_PATH_ABS" > "$CM_BUILD_DIR/ios/.xcode.env.local"
          cat "$CM_BUILD_DIR/ios/.xcode.env.local"
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Register bundle ID (idempotent)
        script: |
          # com.troot.app 이 Developer Portal 에 없으면 자동 등록
          app-store-connect bundle-ids register "com.troot.app" \
            --name "TROOT" \
            --platform IOS \
            || echo "Bundle ID already registered (ok)"
      - name: Fetch or create signing files
        script: |
            # 우리가 등록한 새로운 비밀번호(Key)를 파일로 빼냄
            echo "$CERT_PRIVATE_KEY" > /tmp/ios_key
            
            # 이 새로운 Key를 쥐여주면서 애플 서버에 인증서 새로 만들라고 강제 명령
            app-store-connect fetch-signing-files "com.troot.app" \
              --type IOS_APP_STORE \
              --certificate-key=@file:/tmp/ios_key \
              --create
      - name: Add signing certs to keychain
        script: |
          keychain add-certificates
      - name: Set up provisioning profiles for Xcode
        script: |
          xcode-project use-profiles
      - name: Bump build number from TestFlight
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          cd ios
          agvtool new-version -all $NEW_BUILD_NUMBER
          echo "New build number: $NEW_BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/TRootApp.xcworkspace" \
            --scheme "TRootApp" \
            --config "Release"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - tmddus9259@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # TestFlight 자동 처리 완료까지 대기 (30분 이내). 실패 시 워크플로우도 실패로 마킹.
        submit_to_testflight: true
        # App Store 자동 심사 제출은 안전을 위해 수동 승인 권장 (필요 시 true).
        # submit_to_app_store: false
        # TestFlight 그룹 자동 배포 (App Store Connect > TestFlight > 그룹 이름 정확히 일치해야 함)
        # beta_groups:
        #   - Internal Testers
